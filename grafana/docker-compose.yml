# Local observability stack. Everything listens on 127.0.0.1 (loopback) only, so
# the dashboard and metrics are not exposed on the LAN. Uses host networking so
# Prometheus can scrape the cost_exporter.py that runs on the host loopback.
#
# NOTE: host networking mode requires Linux (not Docker Desktop on macOS/Win).
# Copy .env.example to .env and set a strong Grafana password first.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: finops-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Persist the TSDB so history survives container recreation / `down`.
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: finops-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in grafana/.env (see .env.example)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
