name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: fmt · validate · tflint · trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: TFLint
        run: |
          tflint --init
          tflint

      - name: Trivy IaC security scan
        # Pin to a release tag — never use @master (supply-chain risk).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          trivyignores: .trivyignore
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1
          format: table

  python-ci:
    name: ruff · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt -r requirements-dev.txt

      - name: Ruff check & format
        run: |
          ruff check scripts/ tests/
          ruff format --check scripts/ tests/

      - name: Mypy typecheck
        run: mypy scripts/ tests/

      - name: Pytest with coverage
        run: pytest tests/ -v --cov=scripts --cov-report=term-missing

  security-scan:
    name: bandit · pip-audit · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Gitleaks can scan every commit, not just HEAD.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Bandit (Python SAST)
        # --exclude .venv keeps local runs from scanning the virtualenv.
        run: bandit -r scripts/ --exclude .venv

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r scripts/requirements.txt

      - name: Gitleaks (secret scan)
        run: |
          # Pinned version; bump as new releases come out.
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
